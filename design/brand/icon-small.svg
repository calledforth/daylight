<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Pixel-tuned variant of icon.svg for the 16/32px toolbar sizes: no stars, bolder split. -->
  <defs>
    <radialGradient id="sun" cx="34%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.6" stop-color="#ffb43f"/>
      <stop offset="1" stop-color="#e98418"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6159d6"/>
      <stop offset="1" stop-color="#2a2475"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="8" cy="8" r="7"/></clipPath>
  </defs>
  <circle cx="8" cy="8" r="7" fill="url(#sun)"/>
  <g clip-path="url(#disc)">
    <circle cx="12" cy="12" r="7.6" fill="url(#night)"/>
    <circle cx="12" cy="12" r="7.6" fill="none" stroke="#fff3d4" stroke-opacity="0.8" stroke-width="0.6"/>
  </g>
  <circle cx="8" cy="8" r="6.8" fill="none" stroke="#000" stroke-opacity="0.15" stroke-width="0.4"/>
</svg>
