<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Playground</title>
    <style>
      :root.light {
        color-scheme: light;
        --bg: #f4efe6;
        --fg: #1b1a17;
      }
      :root.dark {
        color-scheme: dark;
        --bg: #12141c;
        --fg: #ece7dc;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: Georgia, "Times New Roman", serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        text-align: center;
      }
      h1 {
        font-size: 72px;
        margin: 0;
        font-weight: 500;
      }
      p {
        opacity: 0.7;
      }
    </style>
    <script>
      function paint() {
        const theme = localStorage.getItem("theme") === "light" ? "light" : "dark";
        document.documentElement.className = theme;
        document.getElementById("label").textContent = theme === "light" ? "Light" : "Dark";
      }
      window.addEventListener("daylight-theme", paint);
      window.addEventListener("storage", paint);
      document.addEventListener("DOMContentLoaded", paint);
    </script>
  </head>
  <body>
    <main>
      <div>
        <p>playground.local</p>
        <h1 id="label">Dark</h1>
        <p>This page follows localStorage.theme, like ChatGPT.</p>
      </div>
    </main>
  </body>
</html>
