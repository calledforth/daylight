name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version from the tag
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # A tag name is attacker-controlled input. Interpolating it into shell
      # source lets a crafted tag run commands on the runner; through env it
      # stays data.
      - name: Refuse to ship a tag that disagrees with the manifest
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          manifest=$(node -p 'require("./extension/manifest.json").version')
          if [ "$manifest" != "$VERSION" ]; then
            echo "tag is $VERSION but manifest.json says $manifest" >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Pack
        run: npm run pack

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/notes.mjs "$VERSION" > dist/notes.md

      - name: Sign with AMO
        env:
          ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          test -n "$ISSUER" || { echo "AMO_JWT_ISSUER is not configured" >&2; exit 1; }
          test -n "$SECRET" || { echo "AMO_JWT_SECRET is not configured" >&2; exit 1; }
          npx --yes web-ext@10.6.0 sign \
            --source-dir extension \
            --channel unlisted \
            --api-key "$ISSUER" \
            --api-secret "$SECRET" \
            --approval-timeout 900000 \
            --artifacts-dir dist/signed
          signed=$(find dist/signed -name '*.xpi' | head -1)
          test -n "$signed" || { echo "AMO did not return a signed XPI" >&2; exit 1; }
          cp "$signed" "dist/daylight-signed.xpi"

      - name: Write Firefox update manifest
        run: node scripts/update-manifest.mjs dist/daylight-signed.xpi dist/updates.json

      - name: Publish
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/daylight-signed.xpi \
            dist/updates.json \
            --title "Daylight $VERSION" \
            --notes-file dist/notes.md
