name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Check the manifest parses and lists every referenced script
        run: |
          node --input-type=module -e '
            import { readFileSync, existsSync } from "node:fs";
            const m = JSON.parse(readFileSync("extension/manifest.json", "utf8"));
            const files = [
              ...m.background.scripts,
              m.action.default_popup,
              ...Object.values(m.icons),
              // Registered at runtime by background.js, so not in the manifest.
              "mediaPatch.js", "mode-light.js", "mode-dark.js", "inject.js",
            ];
            const missing = files.filter((f) => !existsSync(`extension/${f}`));
            if (missing.length) { console.error("missing:", missing); process.exit(1); }
            console.log(`manifest ok, version ${m.version}`);
          '

      - name: Pack
        run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: daylight-xpi
          path: dist/daylight.xpi
