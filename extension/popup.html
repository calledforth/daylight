<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Daylight</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body data-mode="light">
    <div class="popup is-still">
      <div class="sky" aria-hidden="true">
        <div class="sky-layer sky-day"></div>
        <div class="sky-layer sky-dusk"></div>
        <div class="sky-layer sky-night"></div>
        <div class="haze"></div>
        <div id="stars" class="stars"></div>
        <div class="clouds">
          <span class="cloud cloud-1"></span>
          <span class="cloud cloud-2"></span>
          <span class="cloud cloud-3"></span>
          <span class="cloud cloud-4"></span>
          <span class="cloud cloud-5"></span>
          <span class="cloud cloud-6"></span>
        </div>
        <div class="orbit">
          <div class="arm arm-sun">
            <div class="body">
              <div class="sun">
                <span class="sun-corona"></span>
                <span class="sun-rays"></span>
                <span class="sun-streak"></span>
                <span class="sun-disc"></span>
                <span class="sun-ghost sun-ghost-1"></span>
                <span class="sun-ghost sun-ghost-2"></span>
                <span class="sun-ghost sun-ghost-3"></span>
              </div>
            </div>
          </div>
          <div class="arm arm-moon">
            <div class="body">
              <div class="moon">
                <span class="moon-halo"></span>
                <span class="moon-disc"></span>
              </div>
            </div>
          </div>
        </div>
        <div class="glow"></div>
        <div class="scrim"></div>
        <div class="sweep"></div>
      </div>
      <header class="hero">
        <div class="hero-text">
          <p id="status" class="status">Light</p>
          <p id="until" class="until">until 18:00</p>
        </div>
      </header>
      <main class="ui">
        <div class="times">
          <label class="time">
            <input id="lightAt" type="text" inputmode="numeric" maxlength="5" spellcheck="false" />
            <span>light</span>
          </label>
          <span class="arrow" aria-hidden="true">→</span>
          <label class="time">
            <input id="darkAt" type="text" inputmode="numeric" maxlength="5" spellcheck="false" />
            <span>dark</span>
          </label>
        </div>
        <div id="sitesCompact" class="sites-row">
          <button id="sitesToggle" class="sites-toggle" type="button">
            <span id="sitesCount">4 sites</span>
          </button>
          <button id="addOpen" class="plus" type="button" aria-label="Add site">+</button>
        </div>
        <div id="sitesPanel" class="sites-panel" hidden>
          <div class="sites-header">
            <span class="sites-label">Sites</span>
            <button id="addOpenExpanded" class="plus" type="button" aria-label="Add site">+</button>
          </div>
          <form id="addForm" class="add-form" hidden>
            <div class="add-line">
              <input
                id="addInput"
                type="text"
                autocomplete="off"
                spellcheck="false"
                placeholder="domain or URL"
                aria-label="Domain or URL"
              />
              <button class="plus add-submit" type="submit" aria-label="Save site">+</button>
            </div>
            <p class="hint">domain or URL</p>
          </form>
          <ul id="siteList" class="site-list"></ul>
          <p id="syncHint" class="sync-hint" hidden>
            Set each site to its own <strong>System</strong> theme once. Turn on
            <strong>deep</strong> only for a site that still ignores the schedule.
          </p>
        </div>
        <button
          id="modeBtn"
          class="mode"
          type="button"
          aria-label="Override mode: cycles Auto, Light, then Dark"
        >
          <span class="mode-icon" aria-hidden="true">↻</span>
          <span id="modeLabel">Auto</span>
        </button>
      </main>
    </div>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
    <script src="sky.js"></script>
  </body>
</html>
