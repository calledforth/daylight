<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Daylight: a sun with night sweeping across it, like a phase. -->
  <defs>
    <radialGradient id="sun" cx="34%" cy="30%" r="78%">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.38" stop-color="#ffd27a"/>
      <stop offset="0.8" stop-color="#f59a2c"/>
      <stop offset="1" stop-color="#e57a17"/>
    </radialGradient>
    <linearGradient id="night" x1="0.2" y1="0.1" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6a62e0"/>
      <stop offset="0.55" stop-color="#3a3393"/>
      <stop offset="1" stop-color="#1d1a55"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="64" cy="64" r="54"/></clipPath>
  </defs>
  <circle cx="64" cy="64" r="54" fill="url(#sun)"/>
  <g clip-path="url(#disc)">
    <circle cx="94" cy="94" r="58" fill="url(#night)"/>
    <!-- the terminator catches the light -->
    <circle cx="94" cy="94" r="58" fill="none" stroke="#fff3d4" stroke-opacity="0.75" stroke-width="2.5"/>
    <path fill="#f4f2ff" d="M86 70.5c.8 6.3 2.2 7.7 8.5 8.5-6.3.8-7.7 2.2-8.5 8.5-.8-6.3-2.2-7.7-8.5-8.5 6.3-.8 7.7-2.2 8.5-8.5Z"/>
    <circle cx="103" cy="96" r="2.2" fill="#e6e3ff" fill-opacity="0.85"/>
    <circle cx="74" cy="100" r="1.6" fill="#e6e3ff" fill-opacity="0.6"/>
  </g>
  <circle cx="64" cy="64" r="53.25" fill="none" stroke="#000" stroke-opacity="0.12" stroke-width="1.5"/>
</svg>
